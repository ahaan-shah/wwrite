<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5568"/>
      <stop offset="1" stop-color="#252c39"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ebf0"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9cfda"/>
      <stop offset="1" stop-color="#aab3c2"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)"/>

  <!-- Page with a folded top-right corner: the most legible "document" cue at
       small sizes. Inset enough that a circular launcher mask cannot clip it. -->
  <g transform="translate(0 4)">
    <path d="M62 48 h86 l46 46 v114 a10 10 0 0 1 -10 10 H62 a10 10 0 0 1 -10 -10 V58 a10 10 0 0 1 10 -10 z"
          fill="#000000" opacity="0.22"/>
  </g>
  <path d="M62 48 h86 l46 46 v114 a10 10 0 0 1 -10 10 H62 a10 10 0 0 1 -10 -10 V58 a10 10 0 0 1 10 -10 z"
        fill="url(#sheet)"/>
  <path d="M148 48 l46 46 h-36 a10 10 0 0 1 -10 -10 z" fill="url(#fold)"/>

  <!-- Lines of text, ragged like real prose rather than a uniform block. -->
  <g fill="#7c8798">
    <rect x="76" y="112" width="92" height="10" rx="5"/>
    <rect x="76" y="136" width="92" height="10" rx="5"/>
    <rect x="76" y="160" width="70" height="10" rx="5"/>
  </g>
  <!-- Caret on the last line: this is an editor, not a viewer. -->
  <rect x="76" y="182" width="42" height="10" rx="5" fill="#7c8798"/>
  <rect x="126" y="177" width="7" height="20" rx="3.5" fill="#4f9cf9"/>
</svg>
